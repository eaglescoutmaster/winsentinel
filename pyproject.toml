[project]
name = "winsentinel"
version = "0.2.0"
description = "Defensive, read-only security scanner for Windows"
readme = "README.md"
authors = [
    { name = "Mike", email = "51136811+eaglescoutmaster@users.noreply.github.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=2.12.0",
    "keyring>=25.7.0",
    "pefile>=2024.8.26",
    "yara-python>=4.5.4",
]

[project.scripts]
winsentinel = "winsentinel:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
